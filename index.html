<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NEON SURVIVOR</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    background: #050510;
    font-family: Arial, sans-serif;
    color: white;
}

canvas {
    display: block;
}

#ui {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 10;
    pointer-events: none;
}

.stat {
    margin: 5px;
    font-size: 18px;
    text-shadow: 0 0 8px black;
}

#menu {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.85);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 20;
}

.panel {
    background: #111126;
    border: 2px solid #6c5ce7;
    box-shadow: 0 0 40px #6c5ce7;
    border-radius: 15px;
    padding: 35px;
    text-align: center;
    width: 420px;
}

h1 {
    color: #00ffff;
    text-shadow: 0 0 20px #00ffff;
}

button {
    border: none;
    background: #6c5ce7;
    color: white;
    padding: 12px 25px;
    margin: 7px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #8c7cff;
    box-shadow: 0 0 15px #8c7cff;
}

#shop {
    position: fixed;
    right: 20px;
    top: 20px;
    background: rgba(10,10,30,.95);
    padding: 15px;
    border-radius: 10px;
    display: none;
    z-index: 15;
    border: 1px solid #6c5ce7;
}

#message {
    position: fixed;
    top: 45%;
    width: 100%;
    text-align: center;
    font-size: 40px;
    font-weight: bold;
    pointer-events: none;
    text-shadow: 0 0 20px white;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">
    <div class="stat">❤️ HP: <span id="hp">100</span></div>
    <div class="stat">⭐ Level: <span id="level">1</span></div>
    <div class="stat">
        XP: <span id="xp">0</span>/<span id="nextxp">100</span>
    </div>
    <div class="stat">👾 Wave: <span id="wave">1</span></div>
    <div class="stat">💰 Coins: <span id="coins">0</span></div>
    <div class="stat">🏆 Score: <span id="score">0</span></div>
</div>

<div id="message"></div>


<!-- SHOP -->

<div id="shop">

    <h2>🛒 UPGRADES</h2>

    <button onclick="upgradeDamage()">
        Damage +5 ($25)
    </button>

    <br>

    <button onclick="upgradeSpeed()">
        Speed +0.5 ($30)
    </button>

    <br>

    <button onclick="upgradeHealth()">
        Max HP +20 ($40)
    </button>

    <br>

    <button onclick="closeShop()">
        Close
    </button>

</div>


<!-- MENU -->

<div id="menu">

    <div class="panel">

        <h1 id="menuTitle">NEON SURVIVOR</h1>

        <p>
            Survive endless waves of enemies.
            <br>
            Level up, collect coins and defeat bosses.
        </p>

        <button onclick="startGame()">
            START GAME
        </button>

        <p>
            WASD / Arrow Keys = Move<br>
            Mouse = Aim<br>
            Left Click = Shoot<br>
            E = Shop
        </p>

        <p>
            🏆 High Score:
            <span id="highscore">0</span>
        </p>

    </div>

</div>


<script>


// ======================================================
// CANVAS
// ======================================================

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;


window.addEventListener("resize", () => {

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

});


// ======================================================
// GAME VARIABLES
// ======================================================

let gameRunning = false;

let score = 0;
let coins = 0;

let wave = 1;

let xp = 0;
let level = 1;
let nextXP = 100;


// IMPORTANT FIX
// Prevents the game from increasing the wave
// hundreds of times during the 1 second delay.

let waveStarting = false;


// ======================================================
// HIGH SCORE
// ======================================================

let highScore =
    Number(localStorage.getItem("neonHighScore")) || 0;

document.getElementById("highscore").textContent =
    highScore;


// ======================================================
// PLAYER
// ======================================================

const player = {

    x: canvas.width / 2,
    y: canvas.height / 2,

    radius: 18,

    hp: 100,
    maxHp: 100,

    speed: 4,

    damage: 20,

    fireRate: 180,

    lastShot: 0
};


// ======================================================
// INPUT
// ======================================================

const keys = {};

const mouse = {

    x: canvas.width / 2,
    y: canvas.height / 2,

    down: false

};


document.addEventListener("keydown", (e) => {

    keys[e.key.toLowerCase()] = true;


    // OPEN SHOP

    if (e.key.toLowerCase() === "e") {

        if (!gameRunning) {
            return;
        }

        const shop =
            document.getElementById("shop");


        if (shop.style.display === "block") {

            shop.style.display = "none";

        } else {

            shop.style.display = "block";

        }

    }

});


document.addEventListener("keyup", (e) => {

    keys[e.key.toLowerCase()] = false;

});


canvas.addEventListener("mousemove", (e) => {

    mouse.x = e.clientX;
    mouse.y = e.clientY;

});


canvas.addEventListener("mousedown", () => {

    mouse.down = true;

});


canvas.addEventListener("mouseup", () => {

    mouse.down = false;

});


// ======================================================
// ARRAYS
// ======================================================

let bullets = [];
let enemies = [];
let particles = [];

let stars = [];


// ======================================================
// CREATE STARS
// ======================================================

for (let i = 0; i < 250; i++) {

    stars.push({

        x: Math.random() * canvas.width,

        y: Math.random() * canvas.height,

        size: Math.random() * 2,

        speed: Math.random() * .5

    });

}


// ======================================================
// START GAME
// ======================================================

function startGame() {

    document.getElementById("menu").style.display =
        "none";


    gameRunning = true;


    score = 0;

    coins = 0;

    wave = 1;


    xp = 0;

    level = 1;

    nextXP = 100;


    // RESET WAVE FIX

    waveStarting = false;


    player.x =
        canvas.width / 2;

    player.y =
        canvas.height / 2;


    player.hp = 100;

    player.maxHp = 100;

    player.speed = 4;

    player.damage = 20;


    bullets = [];

    enemies = [];

    particles = [];


    document.getElementById("shop").style.display =
        "none";


    document.getElementById("menuTitle").textContent =
        "NEON SURVIVOR";


    spawnWave();

    updateUI();

}


// ======================================================
// SPAWN WAVE
// ======================================================

function spawnWave() {

    const amount =
        5 + wave * 2;


    for (let i = 0; i < amount; i++) {

        spawnEnemy();

    }


    // Every 5th wave has a boss

    if (wave % 5 === 0) {

        spawnBoss();

    }

}


// ======================================================
// SPAWN NORMAL ENEMY
// ======================================================

function spawnEnemy() {

    const side =
        Math.floor(Math.random() * 4);


    let x;
    let y;


    if (side === 0) {

        x =
            Math.random() * canvas.width;

        y = -50;

    }


    if (side === 1) {

        x =
            canvas.width + 50;

        y =
            Math.random() * canvas.height;

    }


    if (side === 2) {

        x =
            Math.random() * canvas.width;

        y =
            canvas.height + 50;

    }


    if (side === 3) {

        x = -50;

        y =
            Math.random() * canvas.height;

    }


    const health =
        40 + wave * 8;


    enemies.push({

        x: x,

        y: y,

        radius: 15,

        hp: health,

        maxHp: health,

        speed:
            1 +
            Math.random() * .5 +
            wave * .03,

        damage:
            10 + wave,

        boss: false

    });

}


// ======================================================
// SPAWN BOSS
// ======================================================

function spawnBoss() {

    enemies.push({

        x:
            canvas.width / 2,

        y: -100,

        radius: 45,

        hp:
            1000 +
            wave * 100,

        maxHp:
            1000 +
            wave * 100,

        speed: .7,

        damage: 25,

        boss: true

    });


    showMessage("⚠ BOSS INCOMING ⚠");

}


// ======================================================
// SHOOT
// ======================================================

function shoot() {

    const now =
        Date.now();


    if (
        now - player.lastShot
        <
        player.fireRate
    ) {

        return;

    }


    player.lastShot = now;


    const angle =
        Math.atan2(

            mouse.y - player.y,

            mouse.x - player.x

        );


    bullets.push({

        x: player.x,

        y: player.y,

        vx:
            Math.cos(angle) * 10,

        vy:
            Math.sin(angle) * 10,

        radius: 5,

        damage:
            player.damage

    });

}


// ======================================================
// UPDATE PLAYER
// ======================================================

function updatePlayer() {

    let dx = 0;
    let dy = 0;


    if (
        keys["w"] ||
        keys["arrowup"]
    ) {

        dy--;

    }


    if (
        keys["s"] ||
        keys["arrowdown"]
    ) {

        dy++;

    }


    if (
        keys["a"] ||
        keys["arrowleft"]
    ) {

        dx--;

    }


    if (
        keys["d"] ||
        keys["arrowright"]
    ) {

        dx++;

    }


    if (
        dx !== 0 ||
        dy !== 0
    ) {

        const length =
            Math.hypot(dx, dy);


        dx /= length;
        dy /= length;


        player.x +=
            dx * player.speed;


        player.y +=
            dy * player.speed;

    }


    // Keep player inside screen

    player.x =
        Math.max(

            player.radius,

            Math.min(

                canvas.width -
                player.radius,

                player.x

            )

        );


    player.y =
        Math.max(

            player.radius,

            Math.min(

                canvas.height -
                player.radius,

                player.y

            )

        );


    if (mouse.down) {

        shoot();

    }

}


// ======================================================
// UPDATE BULLETS
// ======================================================

function updateBullets() {

    for (
        let i = bullets.length - 1;
        i >= 0;
        i--
    ) {

        const b =
            bullets[i];


        b.x += b.vx;
        b.y += b.vy;


        // Remove bullets outside screen

        if (

            b.x < -50 ||

            b.x >
            canvas.width + 50 ||

            b.y < -50 ||

            b.y >
            canvas.height + 50

        ) {

            bullets.splice(i, 1);

            continue;

        }


        // Check collision

        for (
            let j = enemies.length - 1;
            j >= 0;
            j--
        ) {

            const e =
                enemies[j];


            const distance =
                Math.hypot(

                    b.x - e.x,

                    b.y - e.y

                );


            if (
                distance <
                b.radius + e.radius
            ) {


                e.hp -=
                    b.damage;


                createExplosion(

                    b.x,

                    b.y,

                    5

                );


                bullets.splice(i, 1);


                // Enemy dead

                if (e.hp <= 0) {


                    if (e.boss) {

                        score += 1000;

                        coins += 100;

                        gainXP(500);


                        createExplosion(

                            e.x,

                            e.y,

                            80

                        );

                    }

                    else {

                        score += 100;

                        coins += 5;

                        gainXP(25);


                        createExplosion(

                            e.x,

                            e.y,

                            20

                        );

                    }


                    enemies.splice(j, 1);

                }


                break;

            }

        }

    }

}


// ======================================================
// UPDATE ENEMIES
// ======================================================

function updateEnemies() {

    for (
        let i = enemies.length - 1;
        i >= 0;
        i--
    ) {

        const e =
            enemies[i];


        const angle =
            Math.atan2(

                player.y - e.y,

                player.x - e.x

            );


        e.x +=
            Math.cos(angle) *
            e.speed;


        e.y +=
            Math.sin(angle) *
            e.speed;


        const distance =
            Math.hypot(

                player.x - e.x,

                player.y - e.y

            );


        // Enemy touches player

        if (
            distance <
            player.radius + e.radius
        ) {

            player.hp -=
                e.damage * .02;


            createExplosion(

                player.x,

                player.y,

                1

            );


            if (
                player.hp <= 0
            ) {

                gameOver();

            }

        }

    }


    // ==================================================
    // WAVE FIX
    // ==================================================

    // This is the important part.
    //
    // Without waveStarting, this code would run
    // every frame while waiting for the next wave.

    if (
        enemies.length === 0 &&
        !waveStarting &&
        gameRunning
    ) {

        waveStarting = true;


        wave++;


        score +=
            wave * 100;


        showMessage(
            "WAVE " + wave
        );


        setTimeout(() => {

            // Make sure the player
            // hasn't died during the delay.

            if (!gameRunning) {
                return;
            }


            spawnWave();


            waveStarting = false;


        }, 1000);

    }

}


// ======================================================
// XP SYSTEM
// ======================================================

function gainXP(amount) {

    xp += amount;


    while (
        xp >= nextXP
    ) {

        xp -= nextXP;


        level++;


        nextXP =
            Math.floor(
                nextXP * 1.35
            );


        player.maxHp += 10;

        player.hp =
            player.maxHp;


        player.damage += 3;


        showMessage(
            "⭐ LEVEL UP!"
        );


        createExplosion(

            player.x,

            player.y,

            50

        );

    }

}


// ======================================================
// PARTICLES
// ======================================================

function createExplosion(
    x,
    y,
    amount
) {

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI * 2;


        const speed =
            Math.random() * 5;


        particles.push({

            x: x,

            y: y,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            life:
                30 +
                Math.random() * 30,

            size:
                2 +
                Math.random() * 4

        });

    }

}


// ======================================================
// UPDATE PARTICLES
// ======================================================

function updateParticles() {

    for (
        let i =
            particles.length - 1;

        i >= 0;

        i--
    ) {

        const p =
            particles[i];


        p.x += p.vx;

        p.y += p.vy;


        p.vx *= .96;

        p.vy *= .96;


        p.life--;


        if (
            p.life <= 0
        ) {

            particles.splice(i, 1);

        }

    }

}


// ======================================================
// DRAW BACKGROUND
// ======================================================

function drawBackground() {

    ctx.fillStyle =
        "#050510";


    ctx.fillRect(

        0,

        0,

        canvas.width,

        canvas.height

    );


    // Grid

    ctx.strokeStyle =
        "rgba(80,80,180,.12)";


    const grid = 50;


    for (
        let x = 0;
        x < canvas.width;
        x += grid
    ) {

        ctx.beginPath();

        ctx.moveTo(x, 0);

        ctx.lineTo(
            x,
            canvas.height
        );

        ctx.stroke();

    }


    for (
        let y = 0;
        y < canvas.height;
        y += grid
    ) {

        ctx.beginPath();

        ctx.moveTo(0, y);

        ctx.lineTo(
            canvas.width,
            y
        );

        ctx.stroke();

    }


    // Stars

    for (const s of stars) {

        ctx.fillStyle =
            "white";

        ctx.globalAlpha =
            .5;


        ctx.fillRect(

            s.x,

            s.y,

            s.size,

            s.size

        );

    }


    ctx.globalAlpha = 1;

}


// ======================================================
// DRAW PLAYER
// ======================================================

function drawPlayer() {

    const angle =
        Math.atan2(

            mouse.y - player.y,

            mouse.x - player.x

        );


    ctx.save();


    ctx.translate(

        player.x,

        player.y

    );


    ctx.rotate(angle);


    ctx.shadowBlur = 20;

    ctx.shadowColor =
        "#00ffff";


    ctx.fillStyle =
        "#00ffff";


    ctx.beginPath();


    ctx.moveTo(
        25,
        0
    );


    ctx.lineTo(
        -15,
        -15
    );


    ctx.lineTo(
        -10,
        0
    );


    ctx.lineTo(
        -15,
        15
    );


    ctx.closePath();


    ctx.fill();


    ctx.restore();

}


// ======================================================
// DRAW ENEMIES
// ======================================================

function drawEnemies() {

    for (const e of enemies) {

        ctx.save();


        ctx.shadowBlur =
            e.boss
            ? 35
            : 15;


        ctx.shadowColor =
            e.boss
            ? "#ff00ff"
            : "#ff3030";


        ctx.fillStyle =
            e.boss
            ? "#ff00ff"
            : "#ff3030";


        ctx.beginPath();


        ctx.arc(

            e.x,

            e.y,

            e.radius,

            0,

            Math.PI * 2

        );


        ctx.fill();


        // Health bar background

        ctx.fillStyle =
            "black";


        ctx.fillRect(

            e.x - e.radius,

            e.y - e.radius - 12,

            e.radius * 2,

            5

        );


        // Health

        ctx.fillStyle =
            "#00ff66";


        ctx.fillRect(

            e.x - e.radius,

            e.y - e.radius - 12,

            e.radius * 2 *
            Math.max(
                0,
                e.hp / e.maxHp
            ),

            5

        );


        ctx.restore();

    }

}


// ======================================================
// DRAW BULLETS
// ======================================================

function drawBullets() {

    for (const b of bullets) {

        ctx.shadowBlur =
            15;


        ctx.shadowColor =
            "#ffff00";


        ctx.fillStyle =
            "#ffff00";


        ctx.beginPath();


        ctx.arc(

            b.x,

            b.y,

            b.radius,

            0,

            Math.PI * 2

        );


        ctx.fill();

    }

}


// ======================================================
// DRAW PARTICLES
// ======================================================

function drawParticles() {

    for (const p of particles) {

        ctx.globalAlpha =
            p.life / 60;


        ctx.fillStyle =
            "#00ffff";


        ctx.fillRect(

            p.x,

            p.y,

            p.size,

            p.size

        );

    }


    ctx.globalAlpha = 1;

}


// ======================================================
// SHOP
// ======================================================

function upgradeDamage() {

    if (coins >= 25) {

        coins -= 25;

        player.damage += 5;

        updateUI();

    }

}


function upgradeSpeed() {

    if (coins >= 30) {

        coins -= 30;

        player.speed += .5;

        updateUI();

    }

}


function upgradeHealth() {

    if (coins >= 40) {

        coins -= 40;

        player.maxHp += 20;

        player.hp =
            player.maxHp;

        updateUI();

    }

}


function closeShop() {

    document.getElementById(
        "shop"
    ).style.display = "none";

}


// ======================================================
// UPDATE UI
// ======================================================

function updateUI() {

    document.getElementById(
        "hp"
    ).textContent =
        Math.ceil(player.hp);


    document.getElementById(
        "level"
    ).textContent =
        level;


    document.getElementById(
        "xp"
    ).textContent =
        xp;


    document.getElementById(
        "nextxp"
    ).textContent =
        nextXP;


    document.getElementById(
        "wave"
    ).textContent =
        wave;


    document.getElementById(
        "coins"
    ).textContent =
        coins;


    document.getElementById(
        "score"
    ).textContent =
        score;

}


// ======================================================
// MESSAGE
// ======================================================

function showMessage(text) {

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    setTimeout(() => {

        message.textContent = "";

    }, 1200);

}


// ======================================================
// GAME OVER
// ======================================================

function gameOver() {

    gameRunning = false;


    mouse.down = false;


    if (
        score > highScore
    ) {

        highScore =
            score;


        localStorage.setItem(

            "neonHighScore",

            highScore

        );

    }


    document.getElementById(
        "highscore"
    ).textContent =
        highScore;


    document.getElementById(
        "menu"
    ).style.display =
        "flex";


    document.getElementById(
        "menuTitle"
    ).textContent =
        "💀 GAME OVER";

}


// ======================================================
// MAIN GAME LOOP
// ======================================================

function gameLoop() {

    requestAnimationFrame(
        gameLoop
    );


    if (!gameRunning) {
        return;
    }


    updatePlayer();

    updateBullets();

    updateEnemies();

    updateParticles();


    drawBackground();

    drawBullets();

    drawEnemies();

    drawParticles();

    drawPlayer();


    updateUI();

}


// START LOOP

gameLoop();

</script>

</body>
</html>
